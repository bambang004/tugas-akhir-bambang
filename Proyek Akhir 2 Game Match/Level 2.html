<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<style>

body {
  font-family: Arial;
  text-align: center;
  background: linear-gradient(135deg, #e576ed, #f7b0c3, rgb(208, 60, 60), rgb(229, 244, 177));
  color: white;
}

.grid {
  display: grid;
  grid-template-columns: repeat(5, 80px);
  gap: 10px;
  justify-content: center;
  margin-bottom: 20px;
}

.card {
  width: 80px;
  height: 80px;
}

.box {
  width: 80px;
  height: 80px;
  border-radius: 10px;
  position: relative;
  transform-style: preserve-3d;
  transition: 0.5s;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.box div {
  position: absolute;
  backface-visibility: hidden;
  font-size: 25px;
}

.back {
  transform: rotateY(180deg);
}

.box.open {
  transform: rotateY(180deg);
}

.green {
  background: linear-gradient(135deg, #50ec58, #b3f1c9);
}

/* MATCH */
.box.match {
  background: #7aebef;
}
.btn {
  display: inline-block;
  margin-top: 20px;
  padding: 10px 20px;
  background: white;
  color: red,pink;
  border-radius: 10px;
  text-decoration: none;
}
.iqon{
  font-size: 30px;
}
.info{
  display:flex;
  justify-content:center;
  gap:20px;
  margin:20px;
}

.info-box{
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
  padding:15px 25px;
  border-radius:15px;
  min-width:140px;

  box-shadow:0 5px 15px black;

  border:1px solid rgba(255,255,255,0.2);

  transition:0.3s;
}

.info-box:hover{
  transform:translateY(-5px) scale(1.03);
}

.info-box h3{
  margin:0;
  font-size:22px;
  color:white;
}
.popup{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background: linear-gradient(135deg, #9df58a, #81cddf, rgb(147, 163, 244), rgb(229, 244, 177));

  display:flex;
  justify-content:center;
  align-items:center;

  opacity:0;
  pointer-events:none;

  transition:0.5s;
}

.popup.show{
  opacity:1;
  pointer-events:auto;
}

.popup-box{
  background: linear-gradient(135deg, #66e1ea, #f7b0c3, pink, rgb(229, 244, 177));
  color:red,pink;
  padding:30px;
  border-radius:20px;
  text-align:center;

  animation:pop 0.5s ease;
}

.popup-box h1{
  font-size:40px;
}

.popup-box p{
  font-size:18px;
}

.popup-box button{
  margin-top:15px;
  padding:10px 20px;
  border:none;
  border-radius:10px;
  background: linear-gradient(135deg, #d6c06b, #9e72df, rgb(149, 157, 184), rgb(204, 139, 210));
  color:red, greenyellow;
  cursor:pointer;
}

@keyframes pop{

  0%{
    transform:scale(0.5);
    opacity:0;
  }

  100%{
    transform:scale(1);
    opacity:1;
  }

}
.combo{
  position:fixed;
  top:20%;
  left:50%;
  transform:translateX(-50%);
  font-size:40px;
  font-weight:bold;
  color:yellow;

  animation:comboAnim 1s ease;

  z-index:9999;
}

@keyframes comboAnim{

  0%{
    opacity:0;
    transform:translateX(-50%) scale(0.5);
  }

  50%{
    opacity:1;
    transform:translateX(-50%) scale(1.2);
  }

  100%{
    opacity:0;
    transform:translateX(-50%) scale(1);
  }

}

.confetti{
  position:fixed;

  width:10px;
  height:10px;

  background:red;

  top:-10px;

  animation:fall linear forwards;
}

@keyframes fall{

  to{
    transform:translateY(100vh) rotate(360deg);
  }

}

</style>
</head>

<body>
  

  <div class="info">

  <div class="info-box">
    <h3>⭐ Skor</h3>
    <h3 id="score">0</h3>
  </div>

  <div class="info-box">
    <h3>🏆 High Score</h3>
    <h3 id="highScore">0</h3>
  </div>

  <div class="info-box">
    <h3>⏱️ Waktu</h3>
    <h3 id="timer">0:00</h3>
  </div>

</div>

</div>

<h2>Level 2 🐾</h2>
<div class="grid">




<!-- 20 KARTU = 10 PASANG -->

<div class="card"><div class="box green" data-card="anjing"><div>❓</div><div class="back">🐶</div></div></div>
<div class="card"><div class="box green" data-card="anjing"><div>❓</div><div class="back">🐶</div></div></div>

<div class="card"><div class="box green" data-card="kucing"><div>❓</div><div class="back">🐱</div></div></div>
<div class="card"><div class="box green" data-card="kucing"><div>❓</div><div class="back">🐱</div></div></div>

<div class="card"><div class="box green" data-card="kelinci"><div>❓</div><div class="back">🐰</div></div></div>
<div class="card"><div class="box green" data-card="kelinci"><div>❓</div><div class="back">🐰</div></div></div>

<div class="card"><div class="box green" data-card="panda"><div>❓</div><div class="back">🐼</div></div></div>
<div class="card"><div class="box green" data-card="panda"><div>❓</div><div class="back">🐼</div></div></div>

<div class="card"><div class="box green" data-card="singa"><div>❓</div><div class="back">🦁</div></div></div>
<div class="card"><div class="box green" data-card="singa"><div>❓</div><div class="back">🦁</div></div></div>

<div class="card"><div class="box green" data-card="katak"><div>❓</div><div class="back">🐸</div></div></div>
<div class="card"><div class="box green" data-card="katak"><div>❓</div><div class="back">🐸</div></div></div>

<div class="card"><div class="box green" data-card="monyet"><div>❓</div><div class="back">🐵</div></div></div>
<div class="card"><div class="box green" data-card="monyet"><div>❓</div><div class="back">🐵</div></div></div>

<div class="card"><div class="box green" data-card="harimau"><div>❓</div><div class="back">🐯</div></div></div>
<div class="card"><div class="box green" data-card="harimau"><div>❓</div><div class="back">🐯</div></div></div>

<div class="card"><div class="box green" data-card="rubah"><div>❓</div><div class="back">🦊</div></div></div>
<div class="card"><div class="box green" data-card="rubah"><div>❓</div><div class="back">🦊</div></div></div>

<div class="card"><div class="box green" data-card="sapi"><div>❓</div><div class="back">🐮</div></div></div>
<div class="card"><div class="box green" data-card="sapi"><div>❓</div><div class="back">🐮</div></div></div>

</div>

   

<script>

const cards = document.querySelectorAll('.box');

let first = null;
let second = null;
let lock = false;

/* ================= SCORE ================= */

let score = 0;
let highScore = localStorage.getItem("highScore") || 0;

const scoreText = document.getElementById('score');
const highScoreText = document.getElementById('highScore');

highScoreText.textContent = highScore;

/* ================= TIMER ================= */

let time = 0;
let timerStarted = false;

const timerText = document.getElementById('timer');

/* ================= GAME STATUS ================= */

let matchedCards = 0;
let gameOver = false;

/* ================= SOUND ================= */

const correctSound = new Audio("suara1.mp3");
const wrongSound = new Audio("suara2.mp3");
const winSound = new Audio("suara3.mp3");
const loseSound = new Audio("suara 4.mp3");

/* ================= POPUP ================= */

const popup = document.createElement('div');

popup.innerHTML = `
  <div class="popup-box">
    <h1 id="popup-title"></h1>
    <p id="popup-text"></p>
    <button onclick="location.reload()">Main Lagi</button>
  </div>
`;

popup.classList.add('popup');

document.body.appendChild(popup);

/* ================= TIMER ================= */

function startTimer(){

  setInterval(() => {

    if(gameOver) return;

    time++;

    let minutes = Math.floor(time / 60);
    let seconds = time % 60;

    if(seconds < 10){
      seconds = "0" + seconds;
    }

    timerText.textContent = minutes + ":" + seconds;

    /* KALAH */

    if(time >= 84){

      gameOver = true;

      loseSound.currentTime = 0;
      loseSound.play();

       loseSound.play().catch(() => {
       console.log("Audio gagal diputar");

      });

      document.getElementById('popup-title').innerText =
      "😢 Kamu Kalah";

      document.getElementById('popup-text').innerText =
      "Waktu habis! Coba lagi dan selesaikan lebih cepat.";

      popup.classList.add('show');

    }

  }, 1000);

}

/* ================= GAME ================= */

cards.forEach(card => {

  card.addEventListener('click', () => {

    if(lock) return;
    if(gameOver) return;
    if(card === first) return;

    card.classList.add('open');

    /* TIMER START */

    if(!timerStarted){

      startTimer();
      timerStarted = true;

    }

    if(!first){

      first = card;

    } else {

      second = card;
      lock = true;

      checkMatch();

    }

  });

});

/* ================= CHECK MATCH ================= */

function checkMatch(){

  if(first.dataset.card === second.dataset.card){

    first.classList.add('match');
    second.classList.add('match');

    /* SOUND BENAR */

    correctSound.currentTime = 0;
    correctSound.play();

    /* SCORE */

    score += 10;

    /* BONUS COMBO */

    score += 5;

    scoreText.textContent = score;

    /* HIGH SCORE */

    if(score > highScore){

      highScore = score;

      localStorage.setItem("highScore", highScore);

      highScoreText.textContent = highScore;

    }

    /* COMBO TEXT */

    showCombo("🔥 Combo +15");

    /* HITUNG PASANGAN */

    matchedCards += 2;

    reset();

    /* MENANG */

    if(matchedCards === cards.length){

      gameOver = true;

      winSound.currentTime = 0;
      winSound.play();

      document.getElementById('popup-title').innerText =
      "🎉 Level 2 Selesai";

      document.getElementById('popup-text').innerText =
      "Hebat! Kamu berhasil menyelesaikan semua kartu.\nBersiap masuk ke Level 3 🚀";

      popup.classList.add('show');

      createConfetti();

      /* PINDAH LEVEL */

      setTimeout(() => {

        localStorage.setItem("level2Score", score);
        localStorage.setItem("level2Time", timerText.textContent);

        window.location.href = "level 3.html";

      }, 3000);

    }

  } else {

    /* SOUND SALAH */

    wrongSound.currentTime = 0;
    wrongSound.play();

    setTimeout(() => {

      first.classList.remove('open');
      second.classList.remove('open');

      reset();

    }, 700);

  }

}

/* ================= RESET ================= */

function reset(){

  first = null;
  second = null;
  lock = false;

}

/* ================= SHUFFLE ================= */

function shuffleCards(){

  const grid = document.querySelector('.grid');

  const cardsArray = Array.from(cards);

  cardsArray.sort(() => Math.random() - 0.5);

  cardsArray.forEach(card => {

    grid.appendChild(card.parentElement);

  });

}

shuffleCards();

/* ================= COMBO TEXT ================= */

function showCombo(text){

  const combo = document.createElement("div");

  combo.innerText = text;

  combo.classList.add("combo");

  document.body.appendChild(combo);

  setTimeout(() => {

    combo.remove();

  }, 1000);

}

/* ================= CONFETTI ================= */

function createConfetti(){

  for(let i = 0; i < 100; i++){

    const confetti = document.createElement("div");

    confetti.classList.add("confetti");

    confetti.style.left = Math.random() * 100 + "vw";

    confetti.style.animationDuration =
    Math.random() * 3 + 2 + "s";

    document.body.appendChild(confetti);

  }

}
</script>

</body>
</html>
